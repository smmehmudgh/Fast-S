<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0e27">
<title>Fast S — Chat</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- ============ LOADER ============ -->
<div id="loader" class="loader-screen">
  <div class="loader-logo">Fast S</div>
  <div class="spinner"></div>
</div>

<!-- ============ AUTH SCREEN ============ -->
<div id="auth-screen" class="screen hidden">
  <div class="auth-card">
    <div class="auth-logo">Fast S</div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Login</button>
      <button class="auth-tab" data-tab="signup">Sign Up</button>
    </div>

    <!-- Login -->
    <form id="login-form" class="auth-form">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit" class="btn-primary">Login</button>
      <div class="auth-links">
        <a href="#" id="forgot-link">Forgot Password?</a>
      </div>
    </form>

    <!-- Signup -->
    <form id="signup-form" class="auth-form hidden">
      <input type="text" id="signup-name" placeholder="Full Name" required>
      <input type="text" id="signup-username" placeholder="Username (unique)" required>
      <input type="email" id="signup-email" placeholder="Email" required>
      <input type="password" id="signup-password" placeholder="Password (min 6)" required>
      <button type="submit" class="btn-primary">Create Account</button>
    </form>

    <!-- Google -->
    <div class="divider"><span>OR</span></div>
    <button id="google-btn" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.3 35.1 26.8 36 24 36c-5.3 0-9.7-3.1-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C41 35.7 44 30.3 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
      Continue with Google
    </button>

    <div id="auth-error" class="auth-error hidden"></div>
  </div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="main-screen" class="screen hidden">

  <!-- Top Bar -->
  <header id="topbar">
    <div class="topbar-left">
      <button id="back-btn" class="icon-btn hidden">←</button>
      <img id="chat-partner-avatar" class="chat-partner-avatar hidden" src="" alt="">
      <div id="topbar-title" class="topbar-title" data-clickable="false">Fast S</div>
    </div>
    <div class="topbar-right">
      <button id="theme-btn" class="icon-btn" title="Theme">🌓</button>
      <button id="notif-btn" class="icon-btn" title="Notifications">
        🔔<span id="notif-badge" class="badge hidden">0</span>
      </button>
      <img id="topbar-avatar" class="topbar-avatar" src="" alt="">
    </div>
  </header>

  <!-- Views -->
  <main id="views">

    <!-- === CHATS VIEW === -->
    <div id="view-chats" class="view">
      <div class="view-header">
        <h2>Chats</h2>
        <button id="new-chat-btn" class="fab-sm">+</button>
      </div>
      <input type="text" id="chat-search" class="search-input" placeholder="🔍 Search chats...">
      <div id="chats-list" class="list"></div>
    </div>

    <!-- === FRIENDS VIEW === -->
    <div id="view-friends" class="view hidden">
      <div class="view-header">
        <h2>Friends</h2>
      </div>
      <input type="text" id="friends-search" class="search-input" placeholder="🔍 Search friends...">
      <div id="friend-requests-section">
        <h3 class="section-title">Friend Requests</h3>
        <div id="friend-requests-list" class="list compact"></div>
      </div>
      <h3 class="section-title">My Friends</h3>
      <div id="friends-list" class="list"></div>
    </div>

    <!-- === SEARCH VIEW === -->
    <div id="view-search" class="view hidden">
      <div class="view-header"><h2>Find People</h2></div>
      <input type="text" id="user-search" class="search-input" placeholder="🔍 Search by name or @username...">
      <div id="search-results" class="list"></div>
    </div>

    <!-- === PROFILE VIEW === -->
    <div id="view-profile" class="view hidden">
      <div class="profile-card">
        <div class="profile-avatar-wrap">
          <img id="profile-avatar" class="profile-avatar" src="" alt="">
          <label for="avatar-upload" class="avatar-upload-btn hidden" id="avatar-upload-label">📷</label>
          <input type="file" id="avatar-upload" accept="image/*" hidden>
        </div>
        <h2 id="profile-name">—</h2>
        <p id="profile-username" class="muted">@—</p>
        <p id="profile-bio" class="profile-bio">No bio yet</p>
      </div>

      <!-- Own profile actions -->
      <div class="profile-actions" id="profile-actions-self">
        <button id="edit-profile-btn" class="btn-secondary">Edit Profile</button>
        <button id="blocked-btn" class="btn-secondary">Blocked Users</button>
        <button id="settings-btn" class="btn-secondary">Settings</button>
      </div>

      <!-- Other user profile actions -->
      <div class="profile-actions hidden" id="profile-actions-other">
        <button id="other-message-btn" class="btn-primary">💬 Message</button>
        <button id="other-add-btn" class="btn-secondary">➕ Add Friend</button>
        <button id="other-sent-btn" class="btn-secondary hidden">✓ Sent</button>
        <button id="other-unfriend-btn" class="btn-secondary hidden">❌ Unfriend</button>
        <button id="other-block-btn" class="btn-secondary">🚫 Block</button>
      </div>

      <div id="profile-stats" class="profile-stats"></div>

      <!-- Own profile only -->
      <div id="profile-self-footer">
        <button id="logout-btn" class="btn-danger">Logout</button>
        <button id="delete-account-btn" class="btn-danger-outline">Delete Account</button>
      </div>
    </div>

    <!-- === CHAT VIEW === -->
    <div id="view-chat" class="view hidden">
      <div id="chat-messages" class="chat-messages"></div>
      <div id="typing-indicator" class="typing-indicator hidden"></div>
      <div id="reply-preview" class="reply-preview hidden"></div>
      <div class="chat-input-bar">
        <button id="attach-btn" class="icon-btn" title="Attach">📎</button>
        <input type="file" id="file-input" hidden>
        <input type="text" id="message-input" class="message-input" placeholder="Type a message...">
        <button id="send-btn" class="send-btn">➤</button>
      </div>
    </div>
  </main>

  <!-- Bottom Nav -->
  <nav id="bottom-nav">
    <button class="nav-btn active" data-view="chats"><span>💬</span><label>Chats</label></button>
    <button class="nav-btn" data-view="friends"><span>👥</span><label>Friends</label></button>
    <button class="nav-btn" data-view="search"><span>🔍</span><label>Search</label></button>
    <button class="nav-btn" data-view="profile"><span>👤</span><label>Profile</label></button>
  </nav>
</div>

<!-- ============ MODAL ============ -->
<div id="modal" class="modal-backdrop hidden">
  <div class="modal-box">
    <h3 id="modal-title">Title</h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn-secondary">Cancel</button>
      <button id="modal-ok" class="btn-primary">OK</button>
    </div>
  </div>
</div>

<!-- ============ NOTIFICATIONS PANEL ============ -->
<div id="notif-panel" class="notif-panel hidden">
  <div class="notif-header">
    <span>🔔 Notifications</span>
    <button id="notif-clear" class="link-btn">Clear</button>
  </div>
  <div id="notif-list" class="notif-list"></div>
</div>

<!-- ============ TOAST ============ -->
<div id="toast-container" class="toast-container"></div>

<!-- ============ CONTEXT MENU ============ -->
<div id="context-menu" class="context-menu hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
